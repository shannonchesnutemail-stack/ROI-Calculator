name: Assemble index.html
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - name: Show starting state
        run: |
          echo "--- before ---"
          ls -la parts/ || true
          wc -c index.html || true
      - name: Remove old index.html and rebuild fresh
        run: |
          rm -f index.html
          cat parts/part00.b64 parts/part01.b64 parts/part02.b64 parts/part03.b64 parts/part04.b64 parts/part05.b64 parts/part06.b64 parts/part07.b64 parts/part08.b64 parts/part09.b64 parts/part10.b64 parts/part11.b64 parts/part12.b64 parts/part13.b64 parts/part14.b64 parts/part15.b64 parts/part16.b64 > index.html
          echo "--- after cat ---"
          wc -c index.html
      - name: Remove parts and this workflow
        run: |
          rm -rf parts .github/workflows/assemble.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Assemble index.html from parts (v4.9.0)" || echo "no changes"
          git push
