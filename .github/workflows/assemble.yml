name: Assemble index.html
on:
  push:
    paths:
      - 'parts/**'
  workflow_dispatch: {}
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts into index.html
        run: |
          cat parts/part*.b64 > index.html
          rm -rf parts .github/workflows/assemble.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble index.html from parts" || echo "no changes"
          git push
